StylesPath = .vale/styles
MinAlertLevel = warning

Packages =

Vocab = SurgicalAI

[*.{md,mdx,txt}]
BasedOnStyles = SurgicalAI

# JSX and JS files also carry user-facing copy. Vale will scan string
# literals and comments by default. Keep the same rules on them.
[*.{jsx,js,tsx,ts}]
BasedOnStyles = SurgicalAI

# seed_data.py carries the tool catalog copy that renders in the UI.
[*.py]
BasedOnStyles = SurgicalAI
